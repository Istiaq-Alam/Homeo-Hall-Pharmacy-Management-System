# Server-level hardening for the Render container.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60

# Keep Apache's prefork pool small enough for Render's 512 MB free instance.
# mod_php loads the framework per worker; Chromium PDF renders need headroom.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    ServerLimit              12
    MaxRequestWorkers        12
    MaxConnectionsPerChild   500
</IfModule>
