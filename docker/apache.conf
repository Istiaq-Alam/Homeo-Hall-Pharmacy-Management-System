<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Debian's Apache ships `Alias /icons/ /usr/share/apache2/icons/` in
    # mods-enabled/alias.conf, which shadows the application's own /icons/
    # directory and made every logo and PWA icon 404 in production. That stock
    # alias is deleted in the Dockerfile; this is the only handler for /icons/
    # left in the image.
    Alias /icons/ /var/www/html/public/icons/
    <Directory /var/www/html/public/icons>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Defence in depth: the document root is public/, so nothing above it is
    # reachable, and dotfiles are never served even if one is misplaced.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Render terminates TLS; make Laravel see the original scheme.
    SetEnvIf X-Forwarded-Proto https HTTPS=on
</VirtualHost>
