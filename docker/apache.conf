<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Defence in depth: the document root is public/, so nothing above it is
    # reachable, and dotfiles are never served even if one is misplaced.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Render terminates TLS; make Laravel see the original scheme.
    SetEnvIf X-Forwarded-Proto https HTTPS=on
</VirtualHost>
