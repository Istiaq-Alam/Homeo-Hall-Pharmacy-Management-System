<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <title>Offline · Homeo-Hall</title>
    <style>
        :root { color-scheme: light; font-family: 'SF Pro Text', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; color: #1d1d1f; background: #f5f5f7; }
        * { box-sizing: border-box; }
        body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); }
        main { width: min(100%, 460px); padding: 38px 30px; border: 1px solid #e0e0e0; border-radius: 18px; background: #fff; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        .eyebrow { margin: 22px 0 10px; color: #0066cc; font-size: 11px; font-weight: 600; letter-spacing: .08em; }
        h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
        p { margin: 0 auto 24px; max-width: 330px; color: #7a7a7a; font-size: 15px; line-height: 1.5; }
        button { min-height: 44px; padding: 10px 24px; border: 0; border-radius: 9999px; background: #0066cc; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0071e3; }
        small { display: block; margin-top: 20px; color: #999; font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" width="72" height="72">
        <p class="eyebrow">HOMEO-HALL</p>
        <h1>You’re offline.</h1>
        <p>The chamber app needs a connection to load current inventory and financial records.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
        <small>Pages are not stored on the device for privacy.</small>
    </main>
</body>
</html>
